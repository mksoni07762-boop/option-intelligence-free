<script>

let currentIndex = "NIFTY";


function selectIndex(index, button) {

    currentIndex = index;

    document.querySelectorAll(".index-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    loadMarketData();
}


function setValue(id, value, suffix = "") {

    const element = document.getElementById(id);

    if (!element) return;

    if (value === null || value === undefined || value === "") {
        element.innerText = "--";
    } else {
        element.innerText = value + suffix;
    }
}


function formatNumber(value) {

    if (value === null || value === undefined || value === "") {
        return "--";
    }

    const number = Number(value);

    if (!Number.isFinite(number)) {
        return "--";
    }

    return number.toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });
}


async function loadMarketData() {

    const status = document.getElementById("connectionStatus");

    status.innerText = "● CONNECTING...";

    try {

        const response = await fetch(
            "/api/market?symbol=" + encodeURIComponent(currentIndex),
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("API error " + response.status);
        }

        const data = await response.json();

        if (!data || data.ok !== true) {
            throw new Error("Invalid API response");
        }


        /* CONNECTION */

        status.innerText = "● ENGINE ONLINE";


        /* MARKET OVERVIEW */

        setValue("price", formatNumber(data.price));

        setValue(
            "change",
            data.change !== undefined && data.change !== null
                ? data.change
                : "0"
        );

        setValue(
            "condition",
            data.market_condition || "WAIT"
        );

        setValue(
            "score",
            (data.score ?? "--") + " / 100"
        );

        setValue(
            "confidence",
            (data.confidence ?? "--") + "%"
        );


        /* FINAL SIGNAL */

        setValue(
            "signal",
            data.signal || "WAIT"
        );


        /* TRADE LEVELS */

        setValue(
            "entry",
            data.entry > 0 ? formatNumber(data.entry) : "--"
        );

        setValue(
            "stoploss",
            data.stoploss > 0 ? formatNumber(data.stoploss) : "--"
        );

        setValue(
            "target1",
            data.target1 > 0 ? formatNumber(data.target1) : "--"
        );

        setValue(
            "target2",
            data.target2 > 0 ? formatNumber(data.target2) : "--"
        );


        /* MARKET STRUCTURE */

        setValue(
            "vwap",
            data.vwap > 0 ? formatNumber(data.vwap) : "--"
        );

        setValue(
            "ema9",
            data.ema9 > 0 ? formatNumber(data.ema9) : "--"
        );

        setValue(
            "ema21",
            data.ema21 > 0 ? formatNumber(data.ema21) : "--"
        );

        setValue(
            "rsi",
            data.rsi > 0 ? Number(data.rsi).toFixed(2) : "--"
        );


        /* LIVE MARKET STORY */

        setValue(
            "story",
            data.statement || "Waiting for live market data."
        );


        /* TECHNICAL INTELLIGENCE */

        setValue(
            "vwapStatus",
            data.vwapStatus || "--"
        );

        setValue(
            "structure",
            data.structure || "--"
        );

        let volumeText = "--";

        if (data.volume !== undefined && data.volume !== null) {

            volumeText = formatNumber(data.volume);

            if (data.volumeState) {
                volumeText += " (" + data.volumeState + ")";
            }
        }

        setValue("volume", volumeText);


        setValue(
            "atr",
            data.atr > 0
                ? Number(data.atr).toFixed(2)
                : "--"
        );


        /* OPTION CHAIN INTELLIGENCE */

        setValue(
            "pcr",
            data.pcr > 0
                ? Number(data.pcr).toFixed(2)
                : "--"
        );

        setValue(
            "callOI",
            data.callOI > 0
                ? formatNumber(data.callOI)
                : "--"
        );

        setValue(
            "putOI",
            data.putOI > 0
                ? formatNumber(data.putOI)
                : "--"
        );

        setValue(
            "iv",
            data.iv > 0
                ? Number(data.iv).toFixed(2)
                : "--"
        );


        /* SUPPORT / RESISTANCE */

        setValue(
            "resistance",
            data.resistance || "--"
        );

        setValue(
            "resistance2",
            data.resistance2 || "--"
        );

        setValue(
            "support",
            data.support || "--"
        );

        setValue(
            "support2",
            data.support2 || "--"
        );


        /* OI POSITIONING */

        const oiTable = document.getElementById("oiTable");

        if (oiTable) {

            const callPosition =
                data.oi_positioning &&
                data.oi_positioning.call
                    ? data.oi_positioning.call
                    : "N/A";

            const putPosition =
                data.oi_positioning &&
                data.oi_positioning.put
                    ? data.oi_positioning.put
                    : "N/A";

            const callChange =
                data.oi_change &&
                data.oi_change.call !== undefined
                    ? formatNumber(data.oi_change.call)
                    : "--";

            const putChange =
                data.oi_change &&
                data.oi_change.put !== undefined
                    ? formatNumber(data.oi_change.put)
                    : "--";

            oiTable.innerHTML = `
                <tr>
                    <td>AGGREGATE</td>
                    <td>${formatNumber(data.callOI)}</td>
                    <td>${callChange}</td>
                    <td>${formatNumber(data.putOI)}</td>
                    <td>${putChange}</td>
                    <td>CE: ${callPosition}<br>PE: ${putPosition}</td>
                </tr>
            `;
        }


        /* FOOTER STATUS */

        const footer = document.querySelector(".footer");

        if (footer) {

            footer.innerText =
                "Option Intelligence Engine • Free Edition • " +
                (data.data_status || "Live data");
        }

    }

    catch (error) {

        console.error("Market data error:", error);

        status.innerText = "● API ERROR";

        setValue(
            "story",
            "Unable to read live market data. Retrying automatically..."
        );
    }

}


/* INITIAL LOAD */

loadMarketData();


/* REFRESH EVERY 10 SECONDS */

setInterval(loadMarketData, 10000);

</script>
