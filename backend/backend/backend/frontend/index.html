<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Option Intelligence Engine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
        }

        .header {
            padding: 18px 25px;
            background: #11182b;
            border-bottom: 1px solid #293452;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 6px 0 0;
            color: #9da9c7;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: #121a30;
            border: 1px solid #293452;
            border-radius: 12px;
            padding: 18px;
        }

        .label {
            color: #9da9c7;
            font-size: 13px;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
            margin-top: 8px;
        }

        .statement {
            margin-top: 15px;
            padding: 22px;
            background: #17213b;
            border-radius: 12px;
            border: 1px solid #334269;
        }

        .statement h2 {
            margin-top: 0;
        }

        .signal {
            font-size: 30px;
            font-weight: bold;
        }

        .score {
            font-size: 42px;
            font-weight: bold;
        }

        @media(max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h1>OPTION INTELLIGENCE ENGINE</h1>
    <p>Intraday OI + Price + Volume Intelligence</p>
</div>

<div class="container">

    <div class="grid">

        <div class="card">
            <div class="label">NIFTY</div>
            <div class="value" id="nifty">--</div>
        </div>

        <div class="card">
            <div class="label">MARKET CONDITION</div>
            <div class="value" id="condition">WAIT</div>
        </div>

        <div class="card">
            <div class="label">CONFIDENCE</div>
            <div class="value" id="confidence">--%</div>
        </div>

    </div>

    <div class="statement">

        <h2>LIVE MARKET STATEMENT</h2>

        <div class="signal" id="signal">
            WAIT
        </div>

        <div class="score" id="score">
            50/100
        </div>

        <p id="statement">
            Waiting for market data...
        </p>

        <p class="label" id="dataStatus">
            Connecting...
        </p>

    </div>

</div>

<script>

async function loadMarket() {

    try {

        const response = await fetch("/api/market");

        const data = await response.json();

        document.getElementById("condition").innerText =
            data.market_condition;

        document.getElementById("confidence").innerText =
            data.confidence + "%";

        document.getElementById("signal").innerText =
            data.signal;

        document.getElementById("score").innerText =
            data.score + "/100";

        document.getElementById("statement").innerText =
            data.statement;

        document.getElementById("dataStatus").innerText =
            data.data_status;

    } catch (error) {

        document.getElementById("dataStatus").innerText =
            "Backend connection unavailable";

    }
}

loadMarket();

setInterval(loadMarket, 10000);

</script>

</body>
</html>
